<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">ai-workflow-backend</title>
  <desc id="desc">Fastify + TypeScript backend for AI workflow orchestration, on-chain audit trail and liquidation risk analysis.</desc>

  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="#0a0e1a"/>

  <!-- subtle grid -->
  <g stroke="#17223a" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
  </g>

  <!-- left: identity -->
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="72" font-size="14" fill="#64748b">$ workflows run --engine=ai --chain=evm</text>
    <text x="64" y="132" font-size="46" font-weight="700" fill="#f1f5f9">ai-workflow-backend</text>
    <rect x="600" y="96" width="14" height="42" fill="#f59e0b"/>
  </g>
  <text x="64" y="172" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">Orquestación de workflows de IA, con auditoría on-chain</text>
  <text x="64" y="196" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">y motor de análisis de riesgo de liquidación.</text>
  <text x="64" y="234" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#475569">Fastify / TypeScript / PostgreSQL / Solidity</text>

  <!-- right: workflow DAG -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <path d="M 685 90 L 800 128"/>
    <path d="M 822 128 L 930 90"/>
    <path d="M 822 128 L 930 190"/>
    <path d="M 950 90 L 1053 138"/>
    <path d="M 950 190 L 1053 148"/>
  </g>

  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">
    <circle cx="680" cy="90" r="7" fill="#0a0e1a" stroke="#22d3ee" stroke-width="2"/>
    <text x="680" y="68" text-anchor="middle">trigger</text>

    <circle cx="810" cy="128" r="10" fill="#f59e0b" filter="url(#glow)"/>
    <text x="810" y="158" text-anchor="middle" fill="#f59e0b">risk check</text>

    <circle cx="940" cy="90" r="7" fill="#0a0e1a" stroke="#22d3ee" stroke-width="2"/>
    <text x="940" y="68" text-anchor="middle">ai provider</text>

    <circle cx="940" cy="190" r="7" fill="#0a0e1a" stroke="#22d3ee" stroke-width="2"/>
    <text x="940" y="215" text-anchor="middle">on-chain</text>

    <circle cx="1060" cy="143" r="7" fill="#0a0e1a" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1084" y="147" text-anchor="start" fill="#94a3b8">complete</text>
  </g>
</svg>
