<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">ai-workflow-backend</title>
  <desc id="desc">Emblem: a hexagonal frame around a three-node workflow cycle, with the risk-check node highlighted.</desc>

  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="156" fill="#0a0e1a"/>
  <circle cx="160" cy="160" r="152" fill="none" stroke="#1e293b" stroke-width="2"/>

  <path d="M 160 35 L 268.25 97.5 L 268.25 222.5 L 160 285 L 51.75 222.5 L 51.75 97.5 Z"
        fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.55"/>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="160" y1="90" x2="99.4" y2="195"/>
    <line x1="160" y1="90" x2="220.6" y2="195"/>
    <line x1="99.4" y1="195" x2="220.6" y2="195"/>
  </g>

  <circle cx="160" cy="90" r="9" fill="#0a0e1a" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="99.4" cy="195" r="9" fill="#0a0e1a" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="220.6" cy="195" r="13" fill="#f59e0b" filter="url(#glow)"/>
</svg>
